<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<style>
:root {
  --bg: #fbfaf7;
  --fg: #1f1e1c;
  --muted: #6b6760;
  --rule: #e3dfd7;
  --code-bg: #f3f0e9;
  --track: #e8e4dc;
  --accent: #0f6e66;
  --focus: #0f6e66;
  --chrome: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans", sans-serif;
  --code: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151514;
    --fg: #e9e7e2;
    --muted: #9c978e;
    --rule: #2d2c29;
    --code-bg: #1d1c1a;
    --track: #2f2e2a;
    --accent: #5cc2b3;
    --focus: #7fd6c9;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 var(--chrome);
}
.page { max-width: 90ch; margin: 0 auto; padding: 40px 16px 64px; }
header { margin-bottom: 32px; }
.tool { margin: 0; color: var(--muted); font-size: 14px; }
h1 { margin: 4px 0 4px; font-size: 22px; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
.count { margin: 0; color: var(--muted); font-size: 14px; }
.result { padding: 20px 0 24px; border-top: 1px solid var(--rule); }
.head { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.rank { flex: none; width: 2.25rem; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
.file { flex: 1; min-width: 0; font: 14px/1.4 var(--code); overflow-wrap: anywhere; }
.score { flex: none; font: 14px/1.4 var(--code); color: var(--muted); font-variant-numeric: tabular-nums; }
.score:empty { display: none; }
.meter { display: block; height: 3px; margin: 8px 0 12px; background: var(--track); border-radius: 2px; overflow: hidden; }
.meter::before { content: ""; display: block; height: 100%; width: calc(var(--s) * 1%); background: var(--accent); }
pre {
  margin: 0;
  padding: 12px 14px;
  background: var(--code-bg);
  border-radius: 4px;
  font: 13.5px/1.55 var(--code);
  tab-size: 4;
  overflow-x: auto;
  white-space: pre;
}
pre:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.result:first-of-type { border-top: 2px solid var(--fg); padding-top: 24px; }
.result:first-of-type .rank { color: var(--accent); font-size: 28px; line-height: 1; }
.result:first-of-type .file { font-size: 15px; font-weight: 600; }
.result:first-of-type .score { color: var(--fg); font-size: 15px; }
.result:first-of-type .meter { height: 6px; border-radius: 3px; }
.result:first-of-type pre { font-size: 14px; }
@media print {
  :root { --bg: #fff; --fg: #000; --muted: #444; --rule: #bbb; --code-bg: #fff; --track: #ddd; --accent: #000; }
  body { font-size: 11pt; }
  .page { max-width: none; padding: 0; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; overflow: visible; border: 1px solid var(--rule); }
  .head, .meter { break-after: avoid; }
  .meter { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="page">
<header>
<p class="tool">sys1grep</p>
<h1 lang="">{{query}}</h1>
<p class="count">Best first. Results: {{count}}</p>
</header>
<main>
<!--result-->
<article class="result">
<div class="head"><span class="rank">{{rank}}</span><span class="file">{{file}}</span><span class="score">{{score}}</span></div>
<span class="meter" style="--s:{{score_pct}}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{score_pct}}" aria-label="relevance"></span>
<pre tabindex="0" lang="">{{lines}}</pre>
</article>
<!--/result-->
</main>
</div>
</body>
</html>
